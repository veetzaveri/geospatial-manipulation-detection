[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crp-geospatial-manipulation-benchmark"
version = "1.0.0"
description = "Code for characterizing adversarial attacks and generative manipulations in geospatial imagery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Veet Zaveri"},
  {name = "Arun S. Maiya"},
]
keywords = [
  "remote sensing",
  "satellite imagery",
  "adversarial attacks",
  "image forensics",
  "deepfake detection",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "timm>=1.0",
  "torch>=2.7",
  "torchvision>=0.22",
]

[project.optional-dependencies]
generation = [
  "accelerate>=1.0",
  "diffusers>=0.33",
  "safetensors>=0.4",
  "transformers>=4.48",
]
remote_models = [
  "open-clip-torch>=2.30",
  "satlaspretrain-models>=0.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[project.urls]
Paper = "https://doi.org/10.3390/rs18122041"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
